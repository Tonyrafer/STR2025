[env:parte3_1]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
board_build.cmake_extra_args = -D MODE=parte3_1

[env:parte3_2a]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
board_build.cmake_extra_args = -D MODE=parte3_2a

[env:parte3_3a]
platform = espressif32@6.5.0
board = esp32dev
framework = espidf
monitor_speed = 115200
board_build.cmake_extra_args = -D MODE=parte3_3a

[env:parte3_3b]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
board_build.cmake_extra_args = -D MODE=parte3_3b
